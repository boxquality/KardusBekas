
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090B0E">
<title>BOXQUALITY | Beyond Packaging</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#090B0E;
  color:#E5E5E5;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
  linear-gradient(rgba(83,97,106,.09) 1px,transparent 1px),
  linear-gradient(90deg,rgba(83,97,106,.09) 1px,transparent 1px);
  background-size:45px 45px;
  mask-image:linear-gradient(to bottom,black,transparent 90%);
}
nav{
  height:75px;
  padding:0 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #283139;
  position:relative;
  z-index:5;
}
.logo{
  font-size:21px;
  font-weight:900;
  letter-spacing:2px;
}
.logo span{color:#B68A55}
.nav-tag{
  font-size:10px;
  letter-spacing:3px;
  color:#84919A;
}
.hero{
  min-height:calc(100vh - 75px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:35px 18px 50px;
  position:relative;
}
.eyebrow{
  color:#B68A55;
  letter-spacing:5px;
  font-size:10px;
  font-weight:bold;
  margin-bottom:22px;
}
h1{
  font-size:clamp(38px,8vw,76px);
  line-height:1.02;
  font-weight:900;
  letter-spacing:-3px;
}
h1 span{color:#B68A55}
.subtitle{
  color:#9AA5AC;
  font-size:13px;
  line-height:1.8;
  margin-top:17px;
  max-width:450px;
}
#scene{
  width:100%;
  max-width:720px;
  height:390px;
  position:relative;
  margin:0 auto;
  cursor:grab;
  touch-action:pan-y;
}
#scene:active{cursor:grabbing}
#scene canvas{
  display:block;
  width:100%;
  height:100%;
}
.controls{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  margin-top:-8px;
  position:relative;
  z-index:2;
}
.btn{
  border:1px solid #B68A55;
  background:#B68A55;
  color:#090B0E;
  padding:14px 24px;
  font-weight:900;
  letter-spacing:1.5px;
  font-size:10px;
  cursor:pointer;
  transition:.25s;
}
.btn:hover{
  background:transparent;
  color:#B68A55;
  box-shadow:0 0 25px #B68A5540;
}
.btn.secondary{
  background:transparent;
  color:#E5E5E5;
  border-color:#53616A;
}
.btn.secondary:hover{
  border-color:#B68A55;
  color:#B68A55;
}
.hint{
  color:#68757D;
  font-size:10px;
  letter-spacing:2px;
  margin-top:22px;
}
.bottom{
  display:flex;
  justify-content:center;
  gap:35px;
  flex-wrap:wrap;
  padding:22px;
  border-top:1px solid #283139;
  color:#89949C;
  font-size:9px;
  letter-spacing:2px;
}
.bottom span{color:#B68A55}
#loading{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  color:#B68A55;
  font-size:11px;
  letter-spacing:3px;
  pointer-events:none;
}
@media(max-width:600px){
  nav{height:65px;padding:0 20px}
  .nav-tag{font-size:8px;letter-spacing:1px}
  .hero{min-height:calc(100svh - 65px);padding-top:45px}
  #scene{height:310px}
  h1{letter-spacing:-2px}
  .subtitle{font-size:12px}
  .bottom{gap:15px;font-size:8px}
}
</style>
</head>

<body>

<nav>
  <div class="logo">BOX<span>QUALITY</span></div>
  <div class="nav-tag">PACKAGING • LOGISTICS</div>
</nav>

<main class="hero">
  <div class="eyebrow">NEXT GENERATION PACKAGING</div>

  <h1>BEYOND<br><span>THE BOX.</span></h1>

  <p class="subtitle">
    More than packaging. Built to protect, designed to deliver.
    Discover the BOXQUALITY experience.
  </p>

  <div id="scene">
    <div id="loading">INITIALIZING 3D EXPERIENCE...</div>
  </div>

  <div class="controls">
    <button class="btn" id="openBtn">OPEN THE BOX ↗</button>
    <button class="btn secondary" id="closeBtn">CLOSE BOX</button>
  </div>

  <div class="hint">↔ DRAG TO ROTATE • INTERACTIVE 3D OBJECT</div>
</main>

<footer class="bottom">
  <div><span>01</span> QUALITY</div>
  <div><span>02</span> PACKAGING</div>
  <div><span>03</span> DELIVERY</div>
  <div>BOXQUALITY © 2026</div>
</footer>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const container = document.getElementById('scene');
const loading = document.getElementById('loading');

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  36,
  container.clientWidth/container.clientHeight,
  0.1,
  100
);
camera.position.set(4,3.0,6.8);
camera.lookAt(0,1,0);

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  alpha:true
});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(container.clientWidth,container.clientHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.25;
container.appendChild(renderer.domElement);
loading.style.display='none';

// LIGHTING
scene.add(new THREE.AmbientLight(0xffffff,1.4));

const bronzeLight=new THREE.PointLight(0xB68A55,100,15);
bronzeLight.position.set(3,4,3);
scene.add(bronzeLight);

const topLight=new THREE.DirectionalLight(0xffffff,2.2);
topLight.position.set(-3,7,5);
topLight.castShadow=true;
scene.add(topLight);

const blueLight=new THREE.PointLight(0x53616A,65,12);
blueLight.position.set(-4,2,-3);
scene.add(blueLight);

// MATERIAL
const cardboard=new THREE.MeshStandardMaterial({
  color:0xA8794E,
  roughness:0.88,
  metalness:0.02
});
const darkCardboard=new THREE.MeshStandardMaterial({
  color:0x795333,
  roughness:0.95
});
const insideMaterial=new THREE.MeshStandardMaterial({
  color:0x68472E,
  roughness:1
});

// LOGO TEXTURE
const canvas=document.createElement('canvas');
canvas.width=1024;
canvas.height=512;
const ctx=canvas.getContext('2d');

ctx.fillStyle='#A8794E';
ctx.fillRect(0,0,1024,512);
ctx.fillStyle='#19232A';
ctx.font='900 105px Arial';
ctx.textAlign='center';
ctx.fillText('BOXQUALITY',512,250);
ctx.fillStyle='#E5E5E5';
ctx.font='bold 28px Arial';
ctx.fillText('QUALITY IN EVERY BOX',512,310);

const logoTexture=new THREE.CanvasTexture(canvas);
logoTexture.colorSpace=THREE.SRGBColorSpace;

// BOX GROUP
const box=new THREE.Group();
scene.add(box);

// Dimensions
const W=2.7;
const H=1.65;
const D=2.05;
const T=0.09;

function panel(w,h,d,x,y,z,material){
  const mesh=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    material
  );
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  box.add(mesh);
  return mesh;
}

// Bottom
panel(W,T,D,0,T/2,0,darkCardboard);

// Four walls
panel(W,H,T,0,H/2, D/2-T/2,cardboard);
panel(W,H,T,0,H/2,-D/2+T/2,cardboard);
panel(T,H,D,-W/2+T/2,H/2,0,cardboard);
panel(T,H,D,W/2-T/2,H/2,0,cardboard);

// Interior bottom
panel(W-.18,.025,D-.18,0,.13,0,insideMaterial);

// Printed logo on front
const logo=new THREE.Mesh(
  new THREE.PlaneGeometry(1.75,.88),
  new THREE.MeshBasicMaterial({
    map:logoTexture,
    side:THREE.DoubleSide
  })
);
logo.position.set(0,.92,D/2+.052);
box.add(logo);

// FLAPS WITH HINGES
const flaps=[];

function makeFlap(w,d,x,y,z,axis,angle){
  const hinge=new THREE.Group();
  hinge.position.set(x,y,z);
  box.add(hinge);

  const flap=new THREE.Mesh(
    new THREE.BoxGeometry(w,T,d),
    cardboard
  );
  flap.position.set(0,0,-d/2);
  flap.castShadow=true;
  flap.receiveShadow=true;
  hinge.add(flap);

  flaps.push({
    hinge,
    axis,
    closed:0,
    opened:angle
  });
}

// Front and back
makeFlap(W,.99,0,H,D/2-T/2,'x',2.05);

const back=makeFlap(W,.99,0,H,-D/2+T/2,'x',-2.05);

// Left and right
function sideFlap(sign){
  const hinge=new THREE.Group();
  hinge.position.set(sign*(W/2-T/2),H,0);
  box.add(hinge);

  const flap=new THREE.Mesh(
    new THREE.BoxGeometry(.99,T,D),
    cardboard
  );
  flap.position.set(-.495*sign,0,0);
  flap.castShadow=true;
  flap.receiveShadow=true;
  hinge.add(flap);

  flaps.push({
    hinge,
    axis:'z',
    closed:0,
    opened:sign===1?-2.05:2.05
  });
}
sideFlap(1);
sideFlap(-1);

// FLOOR SHADOW
const floor=new THREE.Mesh(
  new THREE.CircleGeometry(3.2,64),
  new THREE.MeshBasicMaterial({
    color:0x19232A,
    transparent:true,
    opacity:.38
  })
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-.05;
scene.add(floor);

// FLOATING ANIMATION
let targetOpen=false;
let currentOpen=0;
let dragging=false;
let previousX=0;
let previousY=0;
let rotationY=0;
let rotationX=0;

box.position.y=.1;

function openBox(value){
  targetOpen=value;
}

document.getElementById('openBtn')
.addEventListener('click',()=>openBox(true));

document.getElementById('closeBtn')
.addEventListener('click',()=>openBox(false));

// TOUCH / MOUSE ROTATION
container.addEventListener('pointerdown',e=>{
  dragging=true;
  previousX=e.clientX;
  previousY=e.clientY;
  container.setPointerCapture(e.pointerId);
});

container.addEventListener('pointermove',e=>{
  if(!dragging)return;

  const dx=e.clientX-previousX;
  const dy=e.clientY-previousY;

  rotationY+=dx*.009;
  rotationX+=dy*.004;
  rotationX=Math.max(-.35,Math.min(.35,rotationX));

  previousX=e.clientX;
  previousY=e.clientY;
});

container.addEventListener('pointerup',()=>dragging=false);
container.addEventListener('pointercancel',()=>dragging=false);

// AUTO OPEN/CLOSE
let timer=0;

function animate(){
  requestAnimationFrame(animate);

  const time=performance.now()*.001;

  if(!dragging){
    rotationY+=.0025;
  }

  box.rotation.y=rotationY;
  box.rotation.x=rotationX;

  box.position.y=.12+Math.sin(time*1.4)*.09;

  const desired=targetOpen?1:0;
  currentOpen+=(desired-currentOpen)*.055;

  flaps.forEach(f=>{
    f.hinge.rotation[f.axis]=
      THREE.MathUtils.lerp(f.closed,f.opened,currentOpen);
  });

  // Automatically demonstrate opening and closing
  timer+=.012;
  if(timer>950){
    targetOpen=!targetOpen;
    timer=0;
  }

  renderer.render(scene,camera);
}
animate();

// RESPONSIVE
window.addEventListener('resize',()=>{
  const w=container.clientWidth;
  const h=container.clientHeight;
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
  renderer.setSize(w,h);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
</script>

</body>
</html>
